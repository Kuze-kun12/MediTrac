<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediTrac Pharmacist</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-box">+</div>
      <div>
        <h1 class="brand-title">MediTrac</h1>
      </div>
    </div>
    <button class="logout-btn" onclick="location.href='/'">Log out</button>
  </header>

  <main class="page-shell">
    <section class="simple-box">
      <h2>Barangay Health Center Record</h2>
      <p class="small-text">Simple dispensing log. Pick the center, pick the medicine batch, then save.</p>

      <div class="dispense-form">
        <label>
          Barangay Health Center
          <select id="stationSelect">
            <option value="">Select center</option>
          </select>
        </label>

        <label>
          Medicine & Batch
          <select id="batchSelect">
            <option value="">Select medicine batch</option>
          </select>
        </label>

        <label>
          Quantity
          <input id="qtyInput" type="number" min="1" value="1" />
        </label>

        <label>
          For / Note
          <input id="patientName" type="text" placeholder="Barangay distribution" />
        </label>

        <button id="saveBtn" class="primary-btn">Save to Record Log</button>
        <div id="saveMessage" class="msg-box"></div>
      </div>
    </section>

    <section class="simple-box">
      <h3>Dispensing Record Log</h3>
      <div id="recordLog" class="record-log"></div>
    </section>
  </main>

  <script>
    const stationSelect = document.getElementById('stationSelect');
    const batchSelect = document.getElementById('batchSelect');
    const qtyInput = document.getElementById('qtyInput');
    const patientName = document.getElementById('patientName');
    const saveBtn = document.getElementById('saveBtn');
    const saveMessage = document.getElementById('saveMessage');
    const recordLog = document.getElementById('recordLog');

    function setMessage(text, isError = false) {
      saveMessage.textContent = text;
      saveMessage.className = 'msg-box ' + (isError ? 'error' : 'ok');
    }

    async function loadDispensingOptions() {
      const res = await fetch('/api/dispensing-options');
      const data = await res.json();
      const stations = data.stations || data.items || [];
      const batches = data.batches || [];

      stationSelect.innerHTML = '<option value="">Select center</option>' +
        stations.map(item => `<option value="${item.id}">${item.name}</option>`).join('');

      batchSelect.innerHTML = '<option value="">Select medicine batch</option>' +
        batches.map(item => `<option value="${item.id}">${item.medName} (${item.batchNo}) - Qty: ${item.qtyOnHand}</option>`).join('');
    }

    async function loadRecordLog() {
      const res = await fetch('/api/dispensing-records');
      const data = await res.json();
      const items = data.items || [];

      recordLog.innerHTML = items.length
        ? items.map(item => `
            <div class="record-item">
              <div>
                <strong>${item.barangay || 'Center'}</strong>
                <span>${item.medName || ''} (${item.batchNo || ''})</span>
              </div>
              <div class="qty-box">${item.qty || 0}</div>
            </div>
          `).join('')
        : '<p class="empty-small">No saved record yet.</p>';
    }

    saveBtn.addEventListener('click', async function () {
      const payload = {
        station_id: stationSelect.value,
        batch_id: batchSelect.value,
        qty: qtyInput.value,
        patient_name: patientName.value,
      };

      if (!payload.station_id || !payload.batch_id) {
        setMessage('Please choose a barangay health center and medicine batch.', true);
        return;
      }

      try {
        const res = await fetch('/api/dispensing-records', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Failed to save record');
        }

        setMessage('Saved successfully to the dispensing record log.');
        qtyInput.value = '1';
        patientName.value = '';
        await loadRecordLog();
      } catch (error) {
        setMessage(error.message || 'Something went wrong.', true);
      }
    });

    loadDispensingOptions();
    loadRecordLog();
  </script>
</body>
</html>
